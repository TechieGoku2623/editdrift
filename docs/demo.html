<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>editdrift</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1a1208; color: #fff4dc; font-family: Inter, system-ui, sans-serif; }
  body { padding: 28px 36px; display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; align-items: end; margin-bottom: 18px; }
  h1 { margin: 0; font-size: 32px; letter-spacing: -0.04em; }
  header p { margin: 0; color: #c4aa82; }
  main { flex: 1; display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
  .side, .plot { background: #24190c; border: 1px solid #4a3518; border-radius: 18px; padding: 22px; }
  h2 { margin: 0 0 14px; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #f0a202; }
  .row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #3a2a14; font-size: 18px; }
  .row b { font-weight: 600; }
  svg { width: 100%; height: 340px; }
  .alert { margin-top: 16px; padding: 16px 18px; border-radius: 14px; background: #3a280c; border: 1px solid #f0a202; font-size: 18px; opacity: 0; transition: 0.4s ease; }
  .alert.show { opacity: 1; }
  .dot { transition: 0.6s ease; }
</style>
</head>
<body>
<header>
  <h1>editdrift</h1>
  <p>This line, against its own accepted window.</p>
</header>
<main>
  <section class="side">
    <h2>HEK-A</h2>
    <div class="row"><span>Passage</span><b id="passage">12</b></div>
    <div class="row"><span>Lot</span><b id="lot">G3</b></div>
    <div class="row"><span>Growth window</span><b>1.05 – 1.12</b></div>
    <div class="row"><span>Marker window</span><b>0.40 – 0.44</b></div>
    <div class="alert" id="alert">Growth 1.55 is outside 1.05–1.12. Lot changed to G4. Alert.</div>
  </section>
  <section class="plot">
    <h2>Growth by passage</h2>
    <svg viewBox="0 0 640 340">
      <rect x="70" y="40" width="520" height="220" fill="#3a2c14" opacity="0.55"/>
      <text x="78" y="32" fill="#c4aa82" font-size="14">accepted window 1.05–1.12</text>
      <line x1="70" y1="150" x2="590" y2="150" stroke="#f0a202" stroke-dasharray="4 4"/>
      <circle cx="160" cy="168" r="8" fill="#f0a202"/>
      <circle cx="280" cy="140" r="8" fill="#f0a202"/>
      <circle cx="400" cy="156" r="8" fill="#f0a202"/>
      <circle id="next" class="dot" cx="400" cy="156" r="0" fill="#ff5a3c"/>
      <text x="150" y="300" fill="#c4aa82" font-size="14">p8</text>
      <text x="270" y="300" fill="#c4aa82" font-size="14">p10</text>
      <text x="390" y="300" fill="#c4aa82" font-size="14">p12</text>
      <text id="plabel" x="500" y="300" fill="#ffb2a6" font-size="14" opacity="0">p18</text>
    </svg>
  </section>
</main>
<script>
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function play() {
  await wait(900);
  const next = document.getElementById("next");
  next.setAttribute("cx", "530");
  next.setAttribute("cy", "48");
  next.setAttribute("r", "11");
  document.getElementById("plabel").setAttribute("opacity", "1");
  await wait(700);
  document.getElementById("passage").textContent = "18";
  document.getElementById("lot").textContent = "G4";
  await wait(400);
  document.getElementById("alert").classList.add("show");
}
</script>
</body>
</html>
