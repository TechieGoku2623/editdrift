[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "editdrift"
version = "1.0.0"
description = "Compare an edited cell line to its own accepted window."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Choppa Devasai Pranatheswar" }]
dependencies = []

[project.scripts]
editdrift = "editdrift.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
